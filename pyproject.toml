[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Introduction to function calling in LLMs"
authors = [{name = "ppousser"}]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pydantic",
    "torch",
    "transformers",
    "huggingface-hub",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
exclude = ['^\.venv/', '^llm_sdk/', '^explore\.py$']
explicit_package_bases = true
mypy_path = "."
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
follow_imports = "skip"